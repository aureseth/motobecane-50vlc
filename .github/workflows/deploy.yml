name: Déploiement GitHub Pages — Guide Motobécane 50 VLC

on:
  push:
    branches:
      - main
  workflow_dispatch: # permet aussi de déclencher manuellement depuis GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Uploader les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          # Le site est à la racine du dépôt (pas dans un sous-dossier)
          path: "."

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
